openapi: 3.1.0
info:
  title: Gacha Revenue Tracker API
  version: 1.0.0
  description: |
    Public-source mobile IAP estimates and hourly iOS rank observations.
    Values are third-party market estimates, not publisher-reported revenue.
servers:
  - url: https://api.example.com/v1
  - url: http://localhost:8080/v1
tags:
  - name: Catalog
  - name: Revenue
  - name: Versions
  - name: Methodology
  - name: Admin
paths:
  /games:
    get:
      tags: [Catalog]
      operationId: listGames
      summary: List supported games
      responses:
        '200':
          description: Supported games
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Game'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /revenue:
    get:
      tags: [Revenue]
      operationId: listRevenue
      summary: Query comparable revenue estimates
      parameters:
        - in: query
          name: game_id
          schema: {type: string}
        - in: query
          name: grain
          schema:
            type: string
            enum: [month, year, version, banner]
            default: month
        - in: query
          name: from
          schema: {type: string, format: date}
        - in: query
          name: to
          schema: {type: string, format: date}
      responses:
        '200':
          description: Source-labelled mobile revenue time series
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RevenuePoint'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /versions:
    get:
      tags: [Versions]
      operationId: listVersions
      summary: List version, banner, rank, and app-line performance
      parameters:
        - in: query
          name: game_id
          schema: {type: string}
      responses:
        '200':
          description: Version intelligence
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VersionIntelligence'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /app-line-rankings:
    get:
      tags: [Versions]
      operationId: listAppLineRankings
      summary: Rank one game's character banners by hours above a China iOS app line
      parameters:
        - in: query
          name: game_id
          required: true
          schema: {type: string}
        - in: query
          name: app_line_id
          required: true
          schema:
            type: string
            enum: [douyin, tencent_video, qq_music, capcut_cn, netease_music, baidu_netdisk, quark]
      responses:
        '200':
          description: Verified observations sorted by hours above, descending
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AppLineRanking'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
        '400': {description: Missing query parameters}
  /methodology:
    get:
      tags: [Methodology]
      operationId: getMethodology
      summary: Get the active public methodology
      responses:
        '200':
          description: Active model summary
  /admin/ingestions:
    post:
      tags: [Admin]
      operationId: createIngestion
      summary: Queue an authorized-source ingestion
      security: [{cognito: [editor]}]
      responses:
        '202': {description: Ingestion queued}
        '401': {description: Missing or invalid JWT}
        '403': {description: Editor or admin role required}
components:
  securitySchemes:
    cognito:
      type: openIdConnect
      openIdConnectUrl: https://cognito-idp.{region}.amazonaws.com/{userPoolId}/.well-known/openid-configuration
  schemas:
    Game:
      type: object
      required: [id, name_zh, name_en, publisher, platforms, confidence]
      properties:
        id: {type: string}
        name_zh: {type: string}
        name_en: {type: string}
        publisher: {type: string}
        platforms:
          type: array
          items: {type: string}
        confidence:
          type: string
          enum: [SOURCE, A, B+, B, C, N/A]
    RevenuePoint:
      type: object
      required: [game_id, grain, period, estimate, p25, p75, confidence]
      properties:
        game_id: {type: string}
        grain: {type: string, enum: [month, year, version, banner]}
        period: {type: string}
        estimate: {type: number, description: USD millions}
        p25: {type: number, description: Equal to estimate for source snapshots without a published interval}
        p75: {type: number, description: Equal to estimate for source snapshots without a published interval}
        confidence: {type: string}
    VersionIntelligence:
      type: object
      required: [id, game_id, version, phase_zh, phase_en, characters_zh, characters_en, starts_at, ends_at, data_status, ios_grossing_rank_range, app_line_observations]
      properties:
        id: {type: string}
        game_id: {type: string}
        version: {type: string}
        phase_zh: {type: string}
        phase_en: {type: string}
        characters_zh: {type: string}
        characters_en: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        estimate: {type: [number, 'null']}
        p25: {type: [number, 'null']}
        p75: {type: [number, 'null']}
        confidence: {type: string}
        data_status:
          type: string
          enum: [licensed_feed, apple_public_feed, public_calendar, verified_manual, awaiting_feed]
        ios_grossing_rank_range:
          type: object
          additionalProperties:
            type: array
            prefixItems: [{type: [integer, 'null']}, {type: [integer, 'null']}]
            minItems: 2
            maxItems: 2
        app_line_observations:
          type: array
          items:
            type: object
            required: [app_id, name_zh, name_en, hours_above, data_status]
            properties:
              app_id: {type: string}
              name_zh: {type: string}
              name_en: {type: string}
              hours_above: {type: [number, 'null']}
              data_status: {type: string, enum: [licensed_feed, apple_public_feed, verified_manual, awaiting_feed]}
              updated_at: {type: [string, 'null'], format: date-time}
    AppLineRanking:
      type: object
      required: [rank, banner_id, version, phase, characters, starts_at, ends_at, hours_above, data_status, source]
      properties:
        rank: {type: integer, minimum: 1}
        banner_id: {type: string}
        version: {type: string}
        phase: {type: string}
        characters: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        hours_above: {type: number, minimum: 0}
        data_status: {type: string, enum: [licensed_feed, apple_public_feed, verified_manual]}
        source: {type: string}
    EstimateMeta:
      type: object
      required: [currency, unit, basis, data_status, methodology_version]
      properties:
        currency: {const: USD}
        unit: {const: million}
        basis: {const: mobile_iap_ios_android_with_cn_android_1_75x}
        data_status: {type: string}
        methodology_version: {type: string}
