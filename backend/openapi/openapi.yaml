openapi: 3.1.0
info:
  title: Gacha Revenue Tracker API
  version: 3.1.0
  description: |
    Public-source mobile IAP estimates and hourly iOS rank observations.
    Values are third-party market estimates, not publisher-reported revenue.
servers:
  - url: https://{functionId}.lambda-url.ap-northeast-1.on.aws/v1
    variables:
      functionId:
        default: replace-after-deployment
security:
  - BackendProxyToken: []
tags:
  - name: Catalog
  - name: Revenue
  - name: Versions
  - name: Methodology
paths:
  /games:
    get:
      tags: [Catalog]
      operationId: listGames
      summary: List supported games
      responses:
        '200':
          description: Supported games
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Game'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /revenue:
    get:
      tags: [Revenue]
      operationId: listRevenue
      summary: Query comparable revenue estimates
      parameters:
        - in: query
          name: game_id
          schema: {type: string}
        - in: query
          name: grain
          schema:
            type: string
            enum: [month, year, version]
            default: month
        - in: query
          name: from
          schema: {type: string, format: date}
        - in: query
          name: to
          schema: {type: string, format: date}
      responses:
        '200':
          description: Source-labelled mobile revenue time series
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RevenuePoint'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /public-revenue:
    get:
      tags: [Revenue]
      operationId: refreshPublicRevenue
      summary: Return the latest public monthly mobile-revenue series
      description: Fetches and caches the source-published Sensor Tower aggregation. Falls back to the last bundled source snapshot when the upstream page is temporarily unavailable.
      responses:
        '200':
          description: Public monthly revenue series for all supported games
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [game_id, history, source_url]
                      properties:
                        game_id: {type: string}
                        history:
                          type: array
                          items:
                            type: object
                            required: [year, month, value]
                            properties:
                              year: {type: integer}
                              month: {type: integer, minimum: 1, maximum: 12}
                              value: {type: number, description: USD millions}
                        source_url: {type: string, format: uri}
                  meta:
                    type: object
                    additionalProperties: true
  /exchange-rate:
    get:
      tags: [Revenue]
      operationId: getDisplayExchangeRate
      summary: Return the ECB daily USD/CNY display exchange rate
      description: Fetches the official ECB reference rate through Frankfurter, caches it for 12 hours, and explicitly marks the bundled last-known snapshot when the upstream source is unavailable.
      responses:
        '200':
          description: USD/CNY reference rate and source metadata
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ExchangeRate'}
                  meta:
                    type: object
                    required: [fetched_at, fallback_snapshot]
                    properties:
                      fetched_at: {type: string, format: date-time}
                      fallback_snapshot: {type: boolean}
  /versions:
    get:
      tags: [Versions]
      operationId: listVersions
      summary: List normalized version and banner windows
      parameters:
        - in: query
          name: game_id
          schema: {type: string}
      responses:
        '200':
          description: Version intelligence
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VersionIntelligence'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /banner-metrics:
    get:
      tags: [Versions]
      operationId: getBannerMetrics
      summary: Aggregate hourly Apple ranks and China app-line hours for one banner window
      description: Combines licensed historical hourly snapshots with locally collected Apple snapshots. Missing historical data is returned as an explicit coverage status, never as zero.
      parameters:
        - in: query
          name: game_id
          required: true
          schema: {type: string}
        - in: query
          name: start
          required: true
          schema: {type: string, format: date}
        - in: query
          name: end
          required: true
          schema: {type: string, format: date}
      responses:
        '200': {description: Aggregated licensed and Apple hourly rank observations}
        '400': {description: Invalid or missing window parameters}
        '500': {description: DynamoDB query failed}
  /methodology:
    get:
      tags: [Methodology]
      operationId: getMethodology
      summary: Get the active public methodology
      responses:
        '200':
          description: Active model summary
components:
  securitySchemes:
    BackendProxyToken:
      type: apiKey
      in: header
      name: X-Backend-Token
      description: Server-to-server token injected by the Vercel same-origin proxy. Never expose it to browsers.
  schemas:
    Game:
      type: object
      required: [id, name_zh, name_en, publisher, platforms, confidence]
      properties:
        id: {type: string}
        name_zh: {type: string}
        name_en: {type: string}
        publisher: {type: string}
        platforms:
          type: array
          items: {type: string}
        confidence:
          type: string
          enum: [SOURCE, A, B+, B, C, N/A]
    RevenuePoint:
      type: object
      required: [game_id, grain, period, estimate, p25, p75, confidence]
      properties:
        game_id: {type: string}
        grain: {type: string, enum: [month, year, version]}
        period: {type: string}
        estimate: {type: number, description: USD millions}
        p25: {type: number, description: Equal to estimate for source snapshots without a published interval}
        p75: {type: number, description: Equal to estimate for source snapshots without a published interval}
        confidence: {type: string}
    ExchangeRate:
      type: object
      required: [date, base, quote, rate, provider, source_url]
      properties:
        date: {type: string, format: date}
        base: {type: string, const: USD}
        quote: {type: string, const: CNY}
        rate: {type: number, minimum: 4, maximum: 12}
        provider: {type: string}
        source_url: {type: string, format: uri}
    VersionIntelligence:
      type: object
      required: [id, game_id, version, phase_index, phase_zh, phase_en, characters_zh, characters_en, starts_at, ends_at, data_status, ios_grossing_rank_range, app_line_observations]
      properties:
        id: {type: string}
        game_id: {type: string}
        version: {type: string}
        phase_index: {type: integer, minimum: 1, maximum: 9}
        phase_zh: {type: string}
        phase_en: {type: string}
        characters_zh: {type: string}
        characters_en: {type: string}
        starts_at: {type: string, format: date}
        ends_at: {type: string, format: date}
        estimate: {type: [number, 'null']}
        p25: {type: [number, 'null']}
        p75: {type: [number, 'null']}
        confidence: {type: string}
        data_status:
          type: string
          enum: [licensed_feed, apple_public_feed, public_calendar, verified_manual, awaiting_feed]
        source_url: {type: string, format: uri}
        source_updated_at: {type: string, format: date}
        ios_grossing_rank_range:
          type: object
          additionalProperties:
            type: array
            prefixItems: [{type: [integer, 'null']}, {type: [integer, 'null']}]
            minItems: 2
            maxItems: 2
        app_line_observations:
          type: array
          items:
            type: object
            required: [app_id, name_zh, name_en, hours_above, data_status]
            properties:
              app_id: {type: string}
              name_zh: {type: string}
              name_en: {type: string}
              hours_above: {type: [number, 'null']}
              data_status: {type: string, enum: [licensed_feed, apple_public_feed, verified_manual, awaiting_feed]}
              updated_at: {type: [string, 'null'], format: date-time}
    EstimateMeta:
      type: object
      required: [currency, unit, basis, data_status, methodology_version]
      properties:
        currency: {const: USD}
        unit: {const: million}
        basis: {const: mobile_iap_ios_android_with_cn_android_1_75x}
        data_status: {type: string}
        methodology_version: {type: string}
