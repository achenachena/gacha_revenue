openapi: 3.1.0
info:
  title: Gacha Revenue Tracker API
  version: 4.2.0
  description: |
    Public-source mobile IAP estimates and hourly iOS rank observations.
    Values are third-party market estimates, not publisher-reported revenue.
servers:
  - url: https://{functionId}.lambda-url.ap-northeast-1.on.aws/v1
    variables:
      functionId:
        default: replace-after-deployment
security:
  - BackendProxyToken: []
tags:
  - name: Catalog
  - name: Revenue
  - name: Versions
  - name: Methodology
paths:
  /games:
    get:
      tags: [Catalog]
      operationId: listGames
      summary: List supported games
      responses:
        '200':
          description: Supported games
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Game'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /revenue:
    get:
      tags: [Revenue]
      operationId: listRevenue
      summary: Query comparable revenue estimates
      parameters:
        - in: query
          name: game_id
          schema: {type: string}
        - in: query
          name: grain
          schema:
            type: string
            enum: [month, year, version]
            default: month
        - in: query
          name: from
          schema: {type: string, format: date}
        - in: query
          name: to
          schema: {type: string, format: date}
      responses:
        '200':
          description: Source-labelled mobile revenue time series
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RevenuePoint'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /public-revenue:
    get:
      tags: [Revenue]
      operationId: listPublicRevenue
      summary: Return canonical revenue facts and backend aggregates
      description: Reads the latest scheduled source snapshot from DynamoDB, merges it with the verified historical baseline, and computes aligned latest-month, YTD, month-over-month and annual values in Go.
      responses:
        '200':
          description: Public monthly revenue series for all supported games
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, game_id, source_slug, launch_date, name_zh, name_en, publisher, history, source_url, source_fetched_at, source_status, yearly]
                      properties:
                        id: {type: string}
                        game_id: {type: string, description: Backward-compatible alias of id}
                        source_slug: {type: string}
                        launch_date: {type: string, format: date}
                        name_zh: {type: string}
                        name_en: {type: string}
                        publisher: {type: string}
                        history:
                          type: array
                          items: {$ref: '#/components/schemas/RevenueMonth'}
                        source_url: {type: string, format: uri}
                        source_fetched_at: {type: string, format: date-time}
                        source_status: {type: string}
                        latest:
                          oneOf:
                            - {$ref: '#/components/schemas/RevenueMonth'}
                            - {type: 'null'}
                        ytd: {type: [number, 'null']}
                        change_percent: {type: [number, 'null']}
                        yearly:
                          type: array
                          items: {$ref: '#/components/schemas/AnnualRevenue'}
                  meta:
                    type: object
                    additionalProperties: true
                    properties:
                      totals:
                        type: object
                        required: [latest, ytd, covered_games, games]
                        properties:
                          latest: {type: number}
                          ytd: {type: number}
                          covered_games: {type: integer}
                          games: {type: integer}
  /exchange-rate:
    get:
      tags: [Revenue]
      operationId: getDisplayExchangeRate
      summary: Return the ECB daily USD/CNY display exchange rate
      description: Fetches the official ECB reference rate through Frankfurter, caches it for 12 hours, and explicitly marks the bundled last-known snapshot when the upstream source is unavailable.
      responses:
        '200':
          description: USD/CNY reference rate and source metadata
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ExchangeRate'}
                  meta:
                    type: object
                    required: [fetched_at, fallback_snapshot]
                    properties:
                      fetched_at: {type: string, format: date-time}
                      fallback_snapshot: {type: boolean}
  /versions:
    get:
      tags: [Versions]
      operationId: listVersions
      summary: List normalized version and banner windows
      parameters:
        - in: query
          name: game_id
          schema: {type: string}
        - in: query
          name: compact
          description: Set to 1 to omit empty rank and app-line placeholders.
          schema: {type: integer, enum: [1]}
      responses:
        '200':
          description: Version intelligence
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VersionIntelligence'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
  /banner-metrics:
    get:
      tags: [Versions]
      operationId: getBannerMetrics
      summary: Aggregate hourly Apple ranks and China app-line hours for one banner window
      description: Combines licensed historical hourly snapshots with locally collected Apple snapshots and the Go-computed banner-window revenue allocation. Missing historical data is returned as an explicit coverage status, never as zero.
      parameters:
        - in: query
          name: game_id
          required: true
          schema: {type: string}
        - in: query
          name: start
          required: true
          schema: {type: string, format: date}
        - in: query
          name: end
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Aggregated licensed and Apple hourly rank observations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/BannerMetrics'}
                  meta: {type: object}
        '400': {description: Invalid or missing window parameters}
        '500': {description: DynamoDB query failed}
  /banner-rankings:
    get:
      tags: [Versions]
      operationId: listBannerRankings
      summary: Aggregate all banner windows for one game in one request
      description: Reads stored hourly facts once, then applies the same Go aggregation and phase-revenue rules used by the single-window endpoint.
      parameters:
        - in: query
          name: game_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Per-banner observations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/BannerMetrics'}
                        - type: object
                          required: [version_id]
                          properties:
                            version_id: {type: string}
                  meta: {type: object}
        '400': {description: Invalid or missing game identifier}
        '500': {description: Rank snapshot query failed}
  /methodology:
    get:
      tags: [Methodology]
      operationId: getMethodology
      summary: Get the active public methodology
      responses:
        '200':
          description: Active model summary
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Methodology'}
                  meta: {$ref: '#/components/schemas/EstimateMeta'}
components:
  securitySchemes:
    BackendProxyToken:
      type: apiKey
      in: header
      name: X-Backend-Token
      description: Server-to-server token injected by the Vercel same-origin proxy. Never expose it to browsers.
  schemas:
    Game:
      type: object
      required: [id, source_slug, launch_date, name_zh, name_en, publisher, platforms]
      properties:
        id: {type: string}
        source_slug: {type: string}
        launch_date: {type: string, format: date}
        name_zh: {type: string}
        name_en: {type: string}
        publisher: {type: string}
        platforms:
          type: array
          items: {type: string}
    RevenueMonth:
      type: object
      required: [year, month, value, market_coverage, scope]
      properties:
        year: {type: integer}
        month: {type: integer, minimum: 1, maximum: 12}
        value: {type: number, description: USD millions}
        market_coverage: {$ref: '#/components/schemas/MarketCoverage'}
        scope: {$ref: '#/components/schemas/RevenueScope'}
        source_id: {type: string}
        source_url: {type: string, format: uri}
    AnnualRevenue:
      type: object
      required: [year, value, months, complete, market_coverage, scopes]
      properties:
        year: {type: integer}
        value: {type: number, description: USD millions}
        months: {type: integer, minimum: 1, maximum: 12}
        complete: {type: boolean}
        market_coverage: {$ref: '#/components/schemas/MarketCoverage'}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/RevenueScope'}
    RevenuePoint:
      type: object
      required: [game_id, grain, period, estimate, p25, p75, confidence, market_coverage, scope]
      properties:
        game_id: {type: string}
        grain: {type: string, enum: [month, year, version]}
        period: {type: string}
        estimate: {type: number, description: USD millions}
        p25: {type: [number, 'null']}
        p75: {type: [number, 'null']}
        confidence: {type: string}
        market_coverage: {$ref: '#/components/schemas/MarketCoverage'}
        scope: {$ref: '#/components/schemas/RevenueScope'}
    MarketCoverage:
      type: string
      enum: [complete, partial, mixed]
    RevenueScope:
      type: string
      enum: [combined_mobile_estimate, global_mobile_excluding_china, mixed]
    ExchangeRate:
      type: object
      required: [date, base, quote, rate, provider, source_url]
      properties:
        date: {type: string, format: date}
        base: {type: string, const: USD}
        quote: {type: string, const: CNY}
        rate: {type: number, minimum: 4, maximum: 12}
        provider: {type: string}
        source_url: {type: string, format: uri}
    VersionIntelligence:
      type: object
      required: [id, game_id, version, phase_index, phase_zh, phase_en, characters_zh, characters_en, starts_at, ends_at, data_status, ios_grossing_rank_range, app_line_observations]
      properties:
        id: {type: string}
        game_id: {type: string}
        version: {type: string}
        phase_index: {type: integer, minimum: 1, maximum: 9}
        phase_zh: {type: string}
        phase_en: {type: string}
        characters_zh: {type: string}
        characters_en: {type: string}
        starts_at: {type: string, description: ISO date when known; empty when the historical calendar is not yet verified}
        ends_at: {type: string, description: ISO date when known; empty when the historical calendar is not yet verified}
        estimate: {type: [number, 'null']}
        p25: {type: [number, 'null']}
        p75: {type: [number, 'null']}
        confidence: {type: string}
        revenue_coverage: {type: number, minimum: 0, maximum: 1}
        revenue_covered_hours: {type: integer, minimum: 0}
        window_hours: {type: integer, minimum: 0}
        revenue_formula: {type: string}
        revenue_market_coverage: {$ref: '#/components/schemas/MarketCoverage'}
        revenue_scope: {$ref: '#/components/schemas/RevenueScope'}
        coverage_status: {type: string}
        observed_hours: {type: integer, minimum: 0}
        collection_started_at: {type: [string, 'null'], format: date-time}
        data_status:
          type: string
          enum: [licensed_feed, apple_public_feed, public_calendar, verified_manual, awaiting_feed]
        source_url: {type: string}
        source_updated_at: {type: string}
        ios_grossing_rank_range:
          type: object
          additionalProperties:
            type: array
            prefixItems: [{type: [integer, 'null']}, {type: [integer, 'null']}]
            minItems: 2
            maxItems: 2
        rank_evidence:
          oneOf:
            - {$ref: '#/components/schemas/MetricEvidence'}
            - {type: 'null'}
        app_line_observations:
          type: array
          items:
            type: object
            required: [app_id, name_zh, name_en, hours_above, data_status]
            properties:
              app_id: {type: string}
              name_zh: {type: string}
              name_en: {type: string}
              hours_above: {type: [number, 'null']}
              data_status: {type: string, enum: [licensed_feed, apple_public_feed, verified_manual, awaiting_feed]}
              updated_at: {type: [string, 'null'], description: ISO date or date-time supplied by the evidence source}
              evidence:
                oneOf:
                  - {$ref: '#/components/schemas/MetricEvidence'}
                  - {type: 'null'}
    MetricEvidence:
      type: object
      required: [primary_url, cross_check_url, note_zh, note_en]
      properties:
        primary_url: {type: string, format: uri}
        cross_check_url: {type: string, format: uri}
        note_zh: {type: string}
        note_en: {type: string}
    BannerMetrics:
      type: object
      required: [ranks, app_line_observations, source, coverage_status, collection_started_at, phase_revenue]
      properties:
        ranks:
          type: object
          additionalProperties:
            type: object
            required: [peak_rank, lowest_rank, observed_hours, ranked_hours, lowest_is_beyond_feed, feed_limit]
            properties:
              peak_rank: {type: [integer, 'null']}
              lowest_rank: {type: [integer, 'null']}
              observed_hours: {type: integer, minimum: 0}
              ranked_hours: {type: integer, minimum: 0}
              lowest_is_beyond_feed: {type: boolean}
              feed_limit: {type: integer, minimum: 0, description: Actual visible depth of the source snapshot, never an assumed Top 200.}
        app_line_observations:
          type: array
          items:
            type: object
            required: [app_id, hours_above, observed_hours, updated_at]
            properties:
              app_id: {type: string}
              hours_above: {type: integer, minimum: 0}
              observed_hours: {type: integer, minimum: 0}
              updated_at: {type: [string, 'null'], format: date-time}
        source: {type: string, enum: [apple_public_feed, licensed_feed]}
        coverage_status: {type: string}
        collection_started_at: {type: [string, 'null'], format: date-time}
        phase_revenue:
          oneOf:
            - type: object
              required: [estimate, coverage, covered_hours, window_hours, formula, threshold]
              properties:
                estimate: {type: [number, 'null']}
                coverage: {type: number, minimum: 0, maximum: 1}
                covered_hours: {type: integer, minimum: 0}
                window_hours: {type: integer, minimum: 0}
                formula: {type: string}
                threshold: {type: number}
            - {type: 'null'}
    Methodology:
      type: object
      required: [version, basis, excludes_zh, excludes_en, formulas, definitions, sources]
      properties:
        version: {type: string}
        basis: {type: string}
        excludes_zh: {type: string}
        excludes_en: {type: string}
        formulas:
          type: array
          items:
            type: object
            required: [id, title_zh, title_en, expression]
            properties:
              id: {type: string}
              title_zh: {type: string}
              title_en: {type: string}
              expression: {type: string}
        definitions:
          type: array
          items:
            type: object
            required: [symbol, text_zh, text_en]
            properties:
              symbol: {type: string}
              text_zh: {type: string}
              text_en: {type: string}
        sources:
          type: array
          items:
            type: object
            required: [id, label, url]
            properties:
              id: {type: string}
              label: {type: string}
              url: {type: string, format: uri}
    EstimateMeta:
      type: object
      required: [currency, unit, basis, data_status, methodology_version]
      properties:
        currency: {const: USD}
        unit: {const: million}
        basis: {const: mobile_iap_ios_android}
        data_status: {type: string}
        methodology_version: {type: string}
