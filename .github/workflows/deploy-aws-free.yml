name: Deploy free AWS backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-aws-free
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show non-secret OIDC claims
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch(`${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com`, {
            headers: { Authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!response.ok) throw new Error(`OIDC token request returned ${response.status}`);
          const { value } = await response.json();
          const encoded = value.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          const claims = JSON.parse(Buffer.from(encoded, 'base64').toString('utf8'));
          const visible = Object.fromEntries([
            'iss', 'aud', 'sub', 'repository', 'environment', 'ref', 'workflow', 'job_workflow_ref', 'sha',
          ].filter((key) => claims[key] !== undefined).map((key) => [key, claims[key]]));
          console.log(JSON.stringify(visible, null, 2));
          NODE

      - uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum

      - name: Build ARM64 Lambda archives
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p ../artifacts/api ../artifacts/collector
          go build -trimpath -ldflags="-s -w" -o ../artifacts/api/bootstrap ./cmd/lambda-api
          go build -trimpath -ldflags="-s -w" -o ../artifacts/collector/bootstrap ./cmd/lambda-collector
          chmod +x ../artifacts/api/bootstrap ../artifacts/collector/bootstrap
          (cd ../artifacts/api && zip -q ../api.zip bootstrap)
          (cd ../artifacts/collector && zip -q ../collector.zip bootstrap)

      - name: Deploy no-VPC free backend
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          API_ZIP: ${{ github.workspace }}/artifacts/api.zip
          COLLECTOR_ZIP: ${{ github.workspace }}/artifacts/collector.zip
          BACKEND_PROXY_TOKEN: ${{ secrets.BACKEND_PROXY_TOKEN }}
          CALENDAR_FEED_URL: ${{ vars.CALENDAR_FEED_URL }}
          CALENDAR_FEED_TOKEN: ${{ secrets.CALENDAR_FEED_TOKEN }}
          RANK_HISTORY_FEED_URL: ${{ vars.RANK_HISTORY_FEED_URL }}
          RANK_HISTORY_FEED_TOKEN: ${{ secrets.RANK_HISTORY_FEED_TOKEN }}
        run: bash infra/serverless/deploy.sh

      - name: Verify public API
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
          BACKEND_PROXY_TOKEN: ${{ secrets.BACKEND_PROXY_TOKEN }}
        run: |
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 "${API_URL}healthz"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 \
            --header "X-Backend-Token: ${BACKEND_PROXY_TOKEN}" \
            "${API_URL}v1/exchange-rate"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 \
            --header "X-Backend-Token: ${BACKEND_PROXY_TOKEN}" \
            "${API_URL}v1/public-revenue"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 \
            --header "X-Backend-Token: ${BACKEND_PROXY_TOKEN}" \
            "${API_URL}v1/versions?game_id=hsr"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 \
            --header "X-Backend-Token: ${BACKEND_PROXY_TOKEN}" \
            "${API_URL}v1/methodology"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 \
            --header "X-Backend-Token: ${BACKEND_PROXY_TOKEN}" \
            "${API_URL}v1/banner-metrics?game_id=hsr&start=2026-08-01&end=2026-08-03"

      - name: Diagnose API Lambda after failed verification
        if: failure()
        env:
          BACKEND_PROXY_TOKEN: ${{ secrets.BACKEND_PROXY_TOKEN }}
        run: |
          jq -cn --arg token "$BACKEND_PROXY_TOKEN" '{
            version:"2.0",
            rawPath:"/v1/banner-metrics",
            rawQueryString:"game_id=hsr&start=2026-08-01&end=2026-08-03",
            headers:{"x-backend-token":$token},
            requestContext:{http:{method:"GET"}}
          }' >"$RUNNER_TEMP/api-event.json"
          aws lambda invoke \
            --function-name gacha-revenue-free-api \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://$RUNNER_TEMP/api-event.json" \
            "$RUNNER_TEMP/api-output.json"
          jq . "$RUNNER_TEMP/api-output.json"
