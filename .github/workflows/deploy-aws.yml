name: Deploy AWS backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_vpc_id: ${{ vars.AWS_VPC_ID }}
  TF_VAR_public_subnet_ids: ${{ vars.AWS_PUBLIC_SUBNET_IDS }}
  TF_VAR_private_subnet_ids: ${{ vars.AWS_PRIVATE_SUBNET_IDS }}
  TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
  TF_VAR_raw_data_bucket_name: ${{ vars.RAW_DATA_BUCKET_NAME }}
  TF_VAR_image_tag: ${{ github.sha }}
  TF_VAR_api_desired_count: ${{ vars.API_DESIRED_COUNT || '1' }}
  TF_VAR_worker_desired_count: ${{ vars.WORKER_DESIRED_COUNT || '1' }}
  TF_VAR_rds_instance_class: ${{ vars.RDS_INSTANCE_CLASS || 'db.t4g.small' }}
  TF_VAR_redis_node_type: ${{ vars.REDIS_NODE_TYPE || 'cache.t4g.small' }}
  TF_VAR_redis_num_cache_clusters: ${{ vars.REDIS_NUM_CACHE_CLUSTERS || '1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=gacha-revenue/production.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Create ECR repositories
        working-directory: infra/terraform
        run: terraform apply -auto-approve -target=aws_ecr_repository.api -target=aws_ecr_repository.worker

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        working-directory: infra/terraform
        run: |
          API_REPOSITORY="$(terraform output -raw api_repository_url)"
          WORKER_REPOSITORY="$(terraform output -raw worker_repository_url)"
          docker build --target api -t "$API_REPOSITORY:${GITHUB_SHA}" ../../backend
          docker build --target migrate -t "$API_REPOSITORY:${GITHUB_SHA}-migrate" ../../backend
          docker build --target worker -t "$WORKER_REPOSITORY:${GITHUB_SHA}" ../../backend
          docker push "$API_REPOSITORY:${GITHUB_SHA}"
          docker push "$API_REPOSITORY:${GITHUB_SHA}-migrate"
          docker push "$WORKER_REPOSITORY:${GITHUB_SHA}"

      - name: Apply production infrastructure
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      - name: Run versioned PostgreSQL migrations
        working-directory: infra/terraform
        run: |
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          TASK_DEFINITION="$(terraform output -raw migration_task_definition_arn)"
          SUBNETS="$(terraform output -json public_subnet_ids | jq -r 'join(",")')"
          SECURITY_GROUP="$(terraform output -raw tasks_security_group_id)"
          NETWORK="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}"
          TASK_ARN="$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEFINITION" --launch-type FARGATE --network-configuration "$NETWORK" --query 'tasks[0].taskArn' --output text)"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)"
          test "$EXIT_CODE" = "0"

      - name: Roll services onto the migrated release
        working-directory: infra/terraform
        run: |
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          API_SERVICE="$(terraform output -raw api_service_name)"
          WORKER_SERVICE="$(terraform output -raw worker_service_name)"
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --force-new-deployment >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "$WORKER_SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE" "$WORKER_SERVICE"

      - name: Verify API
        working-directory: infra/terraform
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 10 "$(terraform output -raw api_health_url)"
