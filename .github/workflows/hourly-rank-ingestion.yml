name: Hourly Apple rank ingestion

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger idempotent hourly snapshot
        run: curl --fail --show-error --silent --retry 3 --max-time 60 https://gacha-revenue-observatory.lmcmelon.chatgpt.site/api/ranks/refresh
